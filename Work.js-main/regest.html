<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Регистрация</h1>
    </header>

    <main>
        <form action="#" onsubmit="return registerUser(this)">
            <label for="reg-email">Email:</label><br>
            <input type="email" id="reg-email" required><br>
            <label for="reg-password">Пароль:</label><br>
            <input type="password" id="reg-password" required><br>
            <button type="submit">Зарегистрироваться</button>
        </form>
    </main>

    <script src="app.js"></script>
</body>

</html>
