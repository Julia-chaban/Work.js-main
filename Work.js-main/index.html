<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проект " Комменты"</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="container">
    <div class="login">
      <h2>Вход</h2>
      <form id="loginForm">
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Пароль" required />
        <button type="submit">Войти</button>
      </form>
    </div>

    <ul class=" comments">
    </ul>

    <div id="loading-screen" class="hidden">
      <p>Загрузка комментариев...</p>
    </div>
    <form class="add-form hidden">

      <label for="author">Автор</label>
      <input type="text" id="author" class="add-form-name" placeholder="Введите ваше имя">
      <label for="comment">Комментарий:</label>
      <textarea id="comment" class="add-form-text" placeholder="Введите ваш комментарий" rows="4"></textarea>

      <button class="add-form-button">Отправить</button>
    </form>
  </div>

  <div id="global-loader">Loading... </div>

  <script type="module" src="index.js">
  </script>
</body>

</html>
